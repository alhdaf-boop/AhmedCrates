name: Build AhmedCrates

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Extract project
        run: |
          unzip AhmedCrates-project.zip -d source

      - name: Build plugin
        working-directory: source/AhmedCrates
        run: |
          gradle build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: AhmedCrates-JAR
          path: source/AhmedCrates/build/libs/*.jar
